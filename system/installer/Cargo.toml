[package]
name = "alpenglow-installer"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "alpenglow-install"
path = "src/bin/alpenglow-install.rs"

[[bin]]
name = "alpenglow-install-gui"
path = "src/bin/alpenglow-install-gui.rs"
required-features = ["gui"]

[features]
default = []
gui = ["dep:crepuscularity-gpui", "dep:gpui"]

[dependencies]
crepuscularity-tui = "0.4.12"
crepuscularity-gpui = { version = "0.5.0", optional = true, features = ["wayland"] }
gpui = { version = "=0.2.2", default-features = false, optional = true, features = ["font-kit", "wayland"] }
zstd = "0.13.3"

[dev-dependencies]
tempfile = "3"
