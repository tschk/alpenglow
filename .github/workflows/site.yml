name: Site

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for v86 initramfs (e.g. 0.1.495)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          version="${{ github.event.inputs.version || '' }}"
          if [ -z "${version}" ]; then
            ref="${{ github.ref_name }}"
            case "${ref}" in
              v*) version="${ref#v}" ;;
              *) version="$(git rev-list --count HEAD)" ;;
            esac
          fi
          echo "alp_version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - uses: oven-sh/setup-bun@v2

      - name: Install cpio
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cpio

      - name: Build v86 browser kernel and initramfs
        env:
          ALP_VERSION: ${{ steps.version.outputs.alp_version }}
          V86_KERNEL_DOCKER: 1
          FORCE_V86_INITRD: 1
          V86_KERNEL_JOBS: 2
        run: sh scripts/build-v86-initramfs.sh

      - name: Build static site
        run: bun run build:site

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets required for deploy" >&2
            exit 1
          fi
          bunx wrangler pages deploy dist --project-name alpenglow
