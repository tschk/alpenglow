name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version override (e.g. v0.1.392)"
        required: false
      validate_aarch64_desktop_uefi_only:
        description: "Build and boot only the aarch64 desktop ISO; do not upload or publish"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ github.event.inputs.version || '' }}-${{ inputs.validate_aarch64_desktop_uefi_only || false }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.validate_aarch64_desktop_uefi_only }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and create draft release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          version="${INPUT_VERSION}"
          if [ -z "${version}" ]; then
            case "${REF_NAME}" in
              v*) version="${REF_NAME}" ;;
              *) version="v0.1.$(git rev-list --count HEAD)" ;;
            esac
          fi
          case "${version}" in
            v[0-9]*) ;;
            *) echo "invalid release version: ${version}" >&2; exit 1 ;;
          esac
          case "${version}" in
            *[!a-zA-Z0-9._-]*) echo "invalid release version: ${version}" >&2; exit 1 ;;
          esac
          if git rev-parse -q --verify "refs/tags/${version}^{commit}" >/dev/null; then
            test "$(git rev-parse "refs/tags/${version}^{commit}")" = "${GITHUB_SHA}" || {
              echo "release tag points to a different commit: ${version}" >&2
              exit 1
            }
          fi
          if gh release view "${version}" >/dev/null 2>&1; then
            test "$(gh release view "${version}" --json isDraft --jq .isDraft)" = true
            test "$(gh release view "${version}" --json targetCommitish --jq .targetCommitish)" = "${GITHUB_SHA}" || {
              echo "existing draft targets a different commit: ${version}" >&2
              exit 1
            }
          else
            gh release create "${version}" --draft --target "${GITHUB_SHA}" \
              --title "Alpenglow ${version}" \
              --notes "Testing-only, unstable images under active development. Public SKUs are potato, desktop, and internet. x86_64 and aarch64 desktop images ship compressed GPT disk images and UEFI live installer ISOs. ARM64 artifacts target generic UEFI firmware, including UTM; non-UEFI boards require their own firmware and boot chain. Assets: alpenglow-${version}-{potato|desktop|internet}-{x86_64|aarch64}.img.zst and .iso (each with .sha256), and alpenglow-${version}-potato-riscv64.tar.zst with .sha256."
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  validate_aarch64_desktop_uefi:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_aarch64_desktop_uefi_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record exact validation source
        id: source
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "source=${GITHUB_SHA}"
          echo "version=v0.1.$(git rev-list --count HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Check out Alpenglowed
        run: git clone --depth 1 https://github.com/tschk/alpenglowed ../alpenglowed

      - uses: dtolnay/rust-toolchain@stable

      - uses: mlugg/setup-zig@v2

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main 2024-09-12
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Setup QEMU binfmt (arm64)
        run: |
          set -eu
          for attempt in 1 2 3; do
            if docker run --privileged --rm tonistiigi/binfmt --install arm64; then
              docker run --rm --platform linux/arm64 alpine:3.21 uname -m
              exit 0
            fi
            echo "binfmt install attempt ${attempt} failed, retrying..."
            sleep $((attempt * 20))
          done
          echo "failed to install arm64 binfmt after 3 attempts" >&2
          exit 1

      - name: Install Rust targets
        run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - name: Install release tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bcachefs-tools bc bison build-essential curl dosfstools dwarves flex gdisk kpartx libelf-dev libssl-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev mtools pkg-config qemu-efi-aarch64 qemu-system-arm qemu-utils xorriso zstd

      - name: Build aarch64 desktop assets
        env:
          ALPENGLOW_ARCH: aarch64
          ALPENGLOW_EDITION: desktop
          AARCH64_KERNEL_JOBS: '2'
        run: sh scripts/release-assets.sh "${{ steps.source.outputs.version }}"

      - name: Boot aarch64 desktop ISO with UEFI
        run: |
          iso="build/release/assets/alpenglow-${{ steps.source.outputs.version }}-desktop-aarch64.iso"
          firmware="$(find /usr/share -type f \( -name AAVMF_CODE.fd -o -name QEMU_EFI.fd \) -print -quit)"
          test -s "${iso}"
          test -n "${firmware}"
          set +e
          timeout 90 qemu-system-aarch64 -M virt -cpu cortex-a72 -m 2048 -smp 2 -bios "${firmware}" -cdrom "${iso}" -nographic > aarch64-uefi.log 2>&1
          status=$?
          set -e
          if [ "${status}" -ne 124 ] || ! grep -q 'Alpenglow aarch64 root ready' aarch64-uefi.log; then
            echo "aarch64 UEFI boot check failed (QEMU exit status: ${status})" >&2
            tail -n 200 aarch64-uefi.log >&2
            exit 1
          fi

  image:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.validate_aarch64_desktop_uefi_only }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            edition: potato
          - arch: x86_64
            edition: desktop
          - arch: x86_64
            edition: internet
          - arch: aarch64
            edition: potato
          - arch: aarch64
            edition: desktop
          - arch: aarch64
            edition: internet
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out Alpenglowed
        if: matrix.edition == 'desktop' || matrix.edition == 'potato'
        run: git clone --depth 1 https://github.com/tschk/alpenglowed ../alpenglowed

      - uses: dtolnay/rust-toolchain@stable

      - uses: mlugg/setup-zig@v2

      - name: Free disk space
        if: matrix.arch == 'aarch64'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main 2024-09-12
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Setup QEMU binfmt (arm64)
        if: matrix.arch == 'aarch64'
        run: |
          set -eu
          for attempt in 1 2 3; do
            if docker run --privileged --rm tonistiigi/binfmt --install arm64; then
              docker run --rm --platform linux/arm64 alpine:3.21 uname -m
              exit 0
            fi
            echo "binfmt install attempt ${attempt} failed, retrying..."
            sleep $((attempt * 20))
          done
          echo "failed to install arm64 binfmt after 3 attempts" >&2
          exit 1

      - name: Install Rust targets
        run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - name: Install release tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bcachefs-tools bc bison build-essential curl dosfstools dwarves flex gdisk kpartx libelf-dev libssl-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev mtools pkg-config qemu-efi-aarch64 qemu-system-arm qemu-utils xorriso zstd

      - name: Build release assets (${{ matrix.arch }} / ${{ matrix.edition }})
        env:
          ALPENGLOW_ARCH: ${{ matrix.arch }}
          ALPENGLOW_EDITION: ${{ matrix.edition }}
          AARCH64_KERNEL_JOBS: ${{ matrix.arch == 'aarch64' && '2' || '' }}
        run: |
          sh scripts/release-assets.sh "${{ needs.prepare.outputs.version }}"

      - name: Boot aarch64 desktop ISO with UEFI
        if: matrix.arch == 'aarch64' && startsWith(matrix.edition, 'desktop')
        run: |
          iso="build/release/assets/alpenglow-${{ needs.prepare.outputs.version }}-${{ matrix.edition }}-aarch64.iso"
          firmware="$(find /usr/share -type f \( -name AAVMF_CODE.fd -o -name QEMU_EFI.fd \) -print -quit)"
          test -s "${iso}"
          test -n "${firmware}"
          set +e
          timeout 90 qemu-system-aarch64 -M virt -cpu cortex-a72 -m 2048 -smp 2 -bios "${firmware}" -cdrom "${iso}" -nographic > aarch64-uefi.log 2>&1
          status=$?
          set -e
          if [ "${status}" -ne 124 ] || ! grep -q 'Alpenglow aarch64 root ready' aarch64-uefi.log; then
            echo "aarch64 UEFI boot check failed (QEMU exit status: ${status})" >&2
            tail -n 200 aarch64-uefi.log >&2
            exit 1
          fi

      - name: Verify and upload draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ASSET_SCOPE: ${{ matrix.edition }}-${{ matrix.arch }}
        run: |
          set -eu
          sh scripts/upload-release-assets.sh "${VERSION}" "${ASSET_SCOPE}" build/release/assets .

  riscv64:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.validate_aarch64_desktop_uefi_only }}
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          ref: arch/riscv64
          path: riscv64-src

      - uses: mlugg/setup-zig@v2

      - name: Setup QEMU binfmt (arm64)
        run: |
          set -eu
          for attempt in 1 2 3; do
            if docker run --privileged --rm tonistiigi/binfmt --install arm64; then
              exit 0
            fi
            echo "binfmt install attempt ${attempt} failed, retrying..."
            sleep $((attempt * 20))
          done
          exit 1

      - name: Install RISC-V release tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-misc zstd

      - name: Build RISC-V boot bundle
        working-directory: riscv64-src
        run: |
          unset ZIG_GLOBAL_CACHE_DIR ZIG_LOCAL_CACHE_DIR
          mkdir -p system/glowfsctl-zig
          cat > system/glowfsctl-zig/main.zig <<'ZIG'
          pub fn main() void {}
          ZIG
          cat > system/glowfsctl-zig/build.zig <<'ZIG'
          const std = @import("std");
          pub fn build(b: *std.Build) void {
              _ = b.option(bool, "release", "Compatibility with arch/riscv64 build script") orelse false;
              const target = b.standardTargetOptions(.{});
              const optimize = b.standardOptimizeOption(.{});
              const mod = b.createModule(.{
                  .root_source_file = b.path("main.zig"),
                  .target = target,
                  .optimize = optimize,
              });
              const exe = b.addExecutable(.{
                  .name = "glowfsctl",
                  .root_module = mod,
              });
              b.installArtifact(exe);
          }
          ZIG
          perl -0pi -e 's/--platform linux\/arm64/--platform linux\/amd64/g' scripts/build-riscv64.sh
          sh scripts/build-riscv64.sh
          mkdir -p build/release/assets
          asset="alpenglow-${{ needs.prepare.outputs.version }}-potato-riscv64.tar.zst"
          tar -cf - -C build/cross/riscv64 Image initramfs.cpio.gz zig-init alpenglow-kernelctl | zstd -19 -T0 > "build/release/assets/${asset}"
          sha256sum "build/release/assets/${asset}" > "build/release/assets/${asset}.sha256"

      - name: Verify and upload RISC-V draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          sh scripts/upload-release-assets.sh "${VERSION}" potato-riscv64 \
            riscv64-src/build/release/assets riscv64-src

  publish:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.validate_aarch64_desktop_uefi_only }}
    needs:
      - prepare
      - image
      - riscv64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify complete draft and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          test "$(gh release view "${VERSION}" --json isDraft --jq .isDraft)" = true
          mkdir -p build/release/assets
          gh release download "${VERSION}" --dir build/release/assets
          sh scripts/verify-release-assets.sh "${VERSION}" complete build/release/assets .
          gh release edit "${VERSION}" --draft=false
