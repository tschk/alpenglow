# Release editions: userspace build_profile + kernel_profile + image options.
# Roles are first-class SKUs on the same OS (session + policy + artifact).
# Resolved by scripts/edition-resolve.sh (ALPENGLOW_EDITION or ALPENGLOW_ROLE, default standard).
# Override session without changing the image: ALPENGLOW_SESSION=none|alpenglowed|sold|cage
# GRAPHICAL=1 in boot-native.sh means the Alpenglowed/glibc graphics path, not "any GUI".

[editions.fast]
build_profile = "minimal"
kernel_profile = "fast"
fast = 1
graphical = 0
build_services = 0
alpenglow_autologin = 0
alpenglow_desktop_full = 0
world_file = "packages-minimal.txt"
session = "none"
role = "appliance"
artifact = "image"
lock_session = 0
shell_login = 1
fleet_agent = 0
alpenglowed_role = "none"

