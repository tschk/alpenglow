name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  os-appliance:
    name: Alpenglow OS appliance gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check appliance OS policy
        run: scripts/ci-os-appliance.sh

  rust-core:
    name: Alpenglow Rust core gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Rust core
        run: scripts/ci-rust-core.sh

  installer-gui:
    name: Alpenglow installer GUI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install GUI build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev libxcb1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test installer GUI
        run: cargo test --locked -p alpenglow-installer --features gui
      - name: Check live-root library coverage
        run: |
          cargo build --locked -p alpenglow-installer --features gui --bin alpenglow-install-gui
          sudo sh scripts/test-installer-gui-libs.sh target/debug/alpenglow-install-gui

  installer-gui-aarch64:
    name: Alpenglow installer GUI aarch64 musl build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Setup QEMU binfmt (arm64)
        run: |
          set -eu
          for attempt in 1 2 3; do
            if docker run --privileged --rm tonistiigi/binfmt --install arm64; then
              docker run --rm --platform linux/arm64 alpine:3.21 uname -m
              exit 0
            fi
            echo "binfmt install attempt ${attempt} failed, retrying..."
            sleep $((attempt * 20))
          done
          echo "failed to install arm64 binfmt after 3 attempts" >&2
          exit 1
      - name: Build aarch64 musl GUI against the Alpine sysroot
        run: |
          set -eu
          bin="$(sh scripts/build-aarch64-gui.sh)"
          echo "GUI_BIN=${bin}" >> "${GITHUB_ENV}"
      - name: Check the aarch64 GUI loads in an Alpine arm64 userland
        run: sh scripts/smoke-aarch64-gui.sh check "${GUI_BIN}"
      # Starts the GUI under headless cage with software Vulkan (lavapipe) in the emulated
      # userland, then requires a rendered window and the GUI process still running.
      - name: Smoke-run the aarch64 GUI under a headless compositor
        run: sh scripts/smoke-aarch64-gui.sh run "${GUI_BIN}"

  rust-kernel-module:
    name: Rust kernel module compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install kernel build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq flex bison bc libssl-dev libelf-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: rust-src
      - name: Install bindgen
        run: cargo install bindgen-cli --locked
      - name: Build Rust kernel module
        run: scripts/ci-rust-kernel-module.sh

  rust-audit:
    name: Alpenglow Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit --deny warnings 2>&1 || echo "cargo audit found issues (non-blocking)"

  zig:
    name: Alpenglow Zig gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Check Zig code
        run: scripts/ci-zig.sh

  aarch64-cross-compile:
    name: aarch64 cross-compile (no kernel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install file
        run: sudo apt-get update -qq && sudo apt-get install -y -qq file
      - name: Cross-compile aarch64 Zig init and kernelctl
        run: scripts/ci-aarch64-cross.sh

  v86-initramfs:
    name: v86 browser initramfs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build v86 initramfs and verify /init
        run: scripts/ci-v86-initramfs.sh
